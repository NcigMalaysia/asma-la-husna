<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hafalan 99 Nama Allah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }
        .arabic-font {
            font-family: 'Amiri', serif;
        }

        /* Sokongan safe-area untuk telefon pintar moden */
        .safe-top {
            padding-top: max(0.75rem, env(safe-area-inset-top));
        }
        .safe-bottom {
            padding-bottom: max(0.85rem, env(safe-area-inset-bottom));
        }

        /* Animasi peralihan kad */
        .slide-container {
            transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            touch-action: pan-y;
            user-select: none;
        }
        .slide-container.dragging {
            transition: none;
        }
        .fade-out-left {
            opacity: 0;
            transform: translateX(-60px) scale(0.97);
        }
        .fade-out-right {
            opacity: 0;
            transform: translateX(60px) scale(0.97);
        }

        /* Animasi laci bawah (Bottom Sheet) */
        .sheet-panel {
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Bar tatal tersuai */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-[100dvh] flex flex-col items-center justify-between selection:bg-teal-500/30">

    <!-- Bar Atas Aplikasi Mudah Alih -->
    <header class="w-full max-w-md mx-auto px-4 safe-top pb-2 z-20 shrink-0">
        <div class="flex items-center justify-between gap-2 mb-2.5">
            <div>
                <h1 class="text-lg sm:text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-teal-300 to-emerald-200 tracking-tight leading-tight">
                    Asmaul Husna
                </h1>
                <p class="text-slate-400 text-[11px] sm:text-xs">Hafalan 99 Nama Allah</p>
            </div>
            <button onclick="openResetModal()" class="text-xs text-slate-300 hover:text-white active:scale-95 transition-all flex items-center gap-1.5 shrink-0 px-3 py-2 rounded-xl bg-slate-800/80 border border-slate-700/70" aria-label="Mula Semula">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-teal-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>Mula Semula</span>
            </button>
        </div>

        <!-- Menu Pilihan Nombor 1-99 & Lencana Kemajuan -->
        <div class="flex items-center justify-between gap-2 bg-slate-800/70 px-3 py-2 rounded-2xl border border-slate-700/70 backdrop-blur-md">
            <div class="flex items-center gap-2 flex-1 min-w-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-teal-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
                </svg>
                <select id="nameSelector" onchange="jumpToName(this.value)" aria-label="Pilih Nama Allah" class="bg-slate-800 text-teal-100 font-semibold text-sm focus:outline-none cursor-pointer w-full truncate rounded-lg">
                </select>
            </div>
            <span class="text-xs font-bold text-teal-300 bg-teal-950/80 px-2.5 py-1 rounded-full border border-teal-700/60 shrink-0" id="counterBadge">1 / 99</span>
        </div>

        <!-- Bar Kemajuan Visual -->
        <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mt-2.5">
            <div id="progressBar" class="h-full bg-gradient-to-r from-teal-400 to-emerald-400 rounded-full transition-all duration-300" style="width: 1%;"></div>
        </div>
    </header>

    <!-- Ruangan Kad Utama -->
    <main class="w-full max-w-md mx-auto px-4 py-2 flex-1 flex flex-col justify-center z-10">
        <div class="w-full slide-container relative" id="slideContainer">
            <div class="w-full min-h-[380px] sm:min-h-[430px] bg-gradient-to-br from-teal-800 via-teal-900 to-emerald-950 rounded-[2rem] p-6 sm:p-8 flex flex-col items-center justify-center shadow-2xl border border-teal-500/30 relative overflow-hidden">

                <!-- Bar Atas Kad: Nombor & Butang Audio -->
                <div class="absolute top-4 left-4 right-4 flex items-center justify-between z-20">
                    <span class="text-xs font-semibold tracking-wider uppercase text-teal-200/90 bg-teal-950/60 px-3 py-1.5 rounded-full border border-teal-600/40 backdrop-blur-sm" id="cardNumberPill">
                        Nama #1
                    </span>
                    <button id="btnNameAudio" onclick="playCurrentNameAudio()" class="text-teal-100 hover:text-white active:scale-95 bg-teal-950/70 hover:bg-teal-700 p-3 rounded-full transition-all shadow-lg backdrop-blur-sm border border-teal-500/50" title="Dengar Sebutan Arab" aria-label="Dengar Sebutan Arab">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                        </svg>
                    </button>
                </div>

                <!-- Nombor Latar Belakang -->
                <div class="absolute -right-3 -bottom-8 text-teal-950/45 text-[9rem] sm:text-[11rem] font-black z-0 leading-none pointer-events-none" id="cardNumberBg">1</div>

                <!-- Teks Arab, Rumi & Maksud -->
                <div class="flex flex-col items-center justify-center w-full mt-10 mb-6 z-10">
                    <h2 class="arabic-font text-6xl sm:text-7xl text-white mb-4 leading-tight text-center drop-shadow-lg px-2" dir="rtl" id="arabicText">
                        اَللّٰهُ
                    </h2>

                    <div class="w-1/2 border-t border-teal-500/40 my-2.5"></div>

                    <h3 class="text-2xl sm:text-3xl font-bold text-yellow-300 tracking-wide text-center mb-1.5" id="rumiText">
                        Ya Allah
                    </h3>

                    <p class="text-lg sm:text-xl font-medium text-teal-100 text-center leading-snug px-2" id="meaningText">
                        Tuhan Yang Maha Esa
                    </p>
                </div>

                <!-- Butang Tindakan (Buka Laci Bawah) -->
                <div class="w-full grid grid-cols-2 gap-2.5 z-10 mt-auto">
                    <button onclick="toggleInfoPanel('penerangan')" id="btnPenerangan" class="text-xs sm:text-sm font-medium bg-teal-950/65 hover:bg-teal-800 active:scale-95 text-teal-100 px-3 py-3 rounded-2xl transition-all border border-teal-500/40 flex items-center justify-center gap-1.5 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 text-teal-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                        <span>Dalil &amp; Tafsir</span>
                    </button>

                    <button onclick="toggleInfoPanel('amalan')" id="btnAmalan" class="text-xs sm:text-sm font-medium bg-emerald-950/75 hover:bg-emerald-800 active:scale-95 text-amber-200 px-3 py-3 rounded-2xl transition-all border border-amber-400/40 flex items-center justify-center gap-1.5 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 text-amber-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                        </svg>
                        <span>Amalan Zikir</span>
                    </button>
                </div>
            </div>
        </div>

        <p class="text-slate-500 mt-3 text-xs text-center">
            Leret kiri / kanan pada kad untuk tukar nama
        </p>
    </main>

    <!-- Bar Navigasi Bawah Mesra Ibu Jari -->
    <nav class="w-full max-w-md mx-auto px-4 pt-2 safe-bottom z-20 shrink-0">
        <div class="flex items-center gap-3 bg-slate-900/90 backdrop-blur-lg p-2 rounded-3xl border border-slate-800 shadow-2xl">
            <button onclick="prevName()" id="prevBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 active:scale-95 text-white font-semibold py-3.5 px-4 rounded-2xl transition-all flex items-center justify-center gap-1.5 border border-slate-700 disabled:opacity-40 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                <span class="text-sm sm:text-base">Sebelum</span>
            </button>

            <button id="btnNavAudio" onclick="playCurrentNameAudio()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-teal-300 p-3.5 rounded-2xl transition-all border border-teal-700/50 shrink-0" title="Sebut Nama" aria-label="Sebut Nama">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
            </button>

            <button onclick="nextName()" id="nextBtn" class="flex-1 bg-teal-600 hover:bg-teal-500 active:scale-95 text-white font-semibold py-3.5 px-4 rounded-2xl transition-all shadow-lg shadow-teal-900/40 flex items-center justify-center gap-1.5 border border-teal-500 disabled:opacity-40 disabled:cursor-not-allowed">
                <span class="text-sm sm:text-base">Seterus</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </nav>

    <!-- Laci Bawah (Bottom Sheet) untuk Dalil & Amalan Zikir -->
    <div id="infoSheetOverlay" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-40 flex items-end justify-center" onclick="if (event.target === this) closeAllInfoPanels()">
        <div id="infoSheet" class="sheet-panel translate-y-full w-full max-w-md bg-slate-900 border-t border-x border-slate-700/80 rounded-t-3xl p-5 safe-bottom shadow-2xl max-h-[80dvh] flex flex-col">
            <!-- Pemegang Laci -->
            <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto mb-4 shrink-0"></div>

            <!-- Tab Kepala & Butang Tutup -->
            <div class="flex items-center justify-between gap-2 mb-4 shrink-0">
                <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700/70 flex-1">
                    <button id="tabPenerangan" onclick="toggleInfoPanel('penerangan')" class="flex-1 text-xs sm:text-sm font-semibold py-2 px-3 rounded-lg transition-all text-slate-300">
                        Dalil &amp; Tafsir
                    </button>
                    <button id="tabAmalan" onclick="toggleInfoPanel('amalan')" class="flex-1 text-xs sm:text-sm font-semibold py-2 px-3 rounded-lg transition-all text-slate-300">
                        Amalan Zikir
                    </button>
                </div>
                <button onclick="closeAllInfoPanels()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors shrink-0" aria-label="Tutup">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Kandungan Boleh Tatal -->
            <div class="overflow-y-auto pr-1 flex-1">
                <!-- Kotak Penerangan -->
                <div id="peneranganBox" class="hidden text-teal-50 text-sm sm:text-base text-left">
                    <div class="text-xs font-semibold uppercase tracking-wider text-teal-300 mb-2">Dalil &amp; Penerangan</div>
                    <p id="peneranganText" class="leading-relaxed text-slate-200"></p>
                    <!-- Butang Audio Ayat Dalil oleh Syeikh Abdul Rahman Al-Sudais -->
                    <div id="sudaisAudioContainer" class="hidden mt-4 pt-4 border-t border-slate-800 flex flex-col gap-2">
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-slate-400">Bacaan Imam Masjidil Haram</span>
                            <span id="sudaisRefBadge" class="text-xs text-teal-300 font-semibold bg-teal-950/80 px-2.5 py-0.5 rounded-full border border-teal-800"></span>
                        </div>
                        <button id="btnSudaisAyah" onclick="playSudaisAyahAudio()" class="w-full text-sm font-medium bg-emerald-700 hover:bg-emerald-600 active:scale-[0.98] text-white px-4 py-3 rounded-2xl transition-all border border-emerald-500/40 flex items-center justify-center gap-2 shadow-md">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <span id="sudaisBtnLabel">Dengar Ayat Dalil (Syeikh Al-Sudais)</span>
                        </button>
                    </div>
                </div>

                <!-- Kotak Amalan Zikir -->
                <div id="amalanBox" class="hidden text-amber-50 text-sm sm:text-base text-left">
                    <div class="text-xs font-semibold uppercase tracking-wider text-amber-300 mb-2" id="amalanTitle">Amalan Zikir</div>
                    <p id="amalanText" class="leading-relaxed whitespace-pre-line text-slate-200"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Pengesahan Mula Semula (Ganti confirm()) -->
    <div id="resetModal" class="hidden fixed inset-0 bg-slate-950/75 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="if (event.target === this) closeResetModal()">
        <div class="w-full max-w-xs bg-slate-900 border border-slate-700 rounded-3xl p-6 shadow-2xl text-center">
            <div class="w-12 h-12 rounded-2xl bg-teal-950 border border-teal-700/60 text-teal-300 flex items-center justify-center mx-auto mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </div>
            <h3 class="text-lg font-bold text-white mb-1">Mula Semula?</h3>
            <p class="text-sm text-slate-400 mb-5">Kembali ke nama pertama (1. Ya Allah) untuk memulakan hafalan semula.</p>
            <div class="grid grid-cols-2 gap-2.5">
                <button onclick="closeResetModal()" class="py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold transition-colors">
                    Batal
                </button>
                <button onclick="confirmReset()" class="py-2.5 px-4 rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold transition-colors">
                    Ya, Mula
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notifikasi Ringkas -->
    <div id="toastNotice" class="hidden fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-800/95 text-teal-100 text-xs font-medium px-4 py-2.5 rounded-full border border-teal-500/40 shadow-xl backdrop-blur-md">
    </div>

    <script>
        // Data Lengkap 99 Nama Allah (Berbaris Penuh untuk Sebutan Arab Fusha, Dalil Sahih & Amalan Zikir)
        const asmaulHusna = [
            {
                id: 1,
                arabic: "اَللّٰهُ",
                rumi: "Ya Allah",
                meaning: "Tuhan Yang Maha Esa",
                penerangan: "Lafaz Jalalah (Nama Agung) yang merangkumi segala sifat kesempurnaan dan hanya layak disembah. Firman Allah SWT: \"Katakanlah (wahai Muhammad): Tuhanku ialah Allah Yang Maha Esa.\" (Surah Al-Ikhlas 112:1).",
                amalan: "Apabila dizikirkan 500 kali setiap malam, lebih-lebih lagi selepas solat tahajjud atau solat sunat 2 rakaat mempunyai pengaruh yang besar di dalam mencapai segala yang dihajati."
            },
            {
                id: 2,
                arabic: "اَلرَّحْمٰنُ",
                rumi: "Ya Rahman",
                meaning: "Maha Pemurah",
                penerangan: "Allah melimpahkan rahmat dan nikmat-Nya kepada seluruh makhluk di dunia tanpa terkecuali. Dalil: \"Yang Maha Pemurah, lagi Maha Mengasihani.\" (Surah Al-Fatihah 1:3).",
                amalan: "Apabila dizikirkan sesudah solat 5 waktu sebanyak 500 kali, maka hati kita akan menjadi terang, tenang & sifat-sifat pelupa & gugup akan hilang dengan izin Allah."
            },
            {
                id: 3,
                arabic: "اَلرَّحِيْمُ",
                rumi: "Ya Rahim",
                meaning: "Maha Penyayang",
                penerangan: "Allah mengurniakan kasih sayang yang khusus buat hamba-hamba-Nya yang beriman di dunia dan akhirat. Dalil: \"Dan adalah Ia sentiasa Melimpah-limpah rahmat-Nya kepada orang-orang yang beriman.\" (Surah Al-Ahzab 33:43).",
                amalan: "Apabila dizikirkan sebanyak 100 kali setiap hari, Insya Allah kita akan mempunyai daya penarik yang besar sekali hingga manusia merasa cinta & kasih serta sayang terhadap kita."
            },
            {
                id: 4,
                arabic: "اَلْمَلِكُ",
                rumi: "Ya Malik",
                meaning: "Maha Merajai / Pemerintah",
                penerangan: "Allah adalah Penguasa mutlak seluruh alam semesta yang tidak memerlukan sesuatu pun daripada makhluk-Nya. Dalil: \"Dialah Allah, yang tidak ada Tuhan selain Dia, Yang Menguasai (sekalian alam).\" (Surah Al-Hashr 59:23).",
                amalan: "Apabila dizikirkan sebanyak 121 kali setiap pagi atau setelah tergelincirnya matahari, segala perkerjaan yang dilakukan setiap hari akan mendatangkan berkat & kekayaan yang diredhai Allah."
            },
            {
                id: 5,
                arabic: "اَلْقُدُّوْسُ",
                rumi: "Ya Quddus",
                meaning: "Maha Suci",
                penerangan: "Allah Maha Suci daripada sebarang sifat kekurangan, kelemahan, dan penyerupaan dengan makhluk. Dalil: \"Yang Maha Suci, Yang Maha Selamat Sejahtera...\" (Surah Al-Hashr 59:23).",
                amalan: "Apabila dizikirkan sebanyak 100 kali setiap pagi setelah tergelincir matahari, maka hati kita akan terjaga dari semua penyakit hati seperti sombong, iri hati, dengki dan lain-lain."
            },
            {
                id: 6,
                arabic: "اَلسَّلَامُ",
                rumi: "Ya Salam",
                meaning: "Maha Penyelamat / Sejahtera",
                penerangan: "Allah adalah sumber segala kesejahteraan dan keselamatan bagi hamba-hamba-Nya di dunia dan di akhirat. Dalil: Surah Al-Hashr (59:23).",
                amalan: "Apabila dizikirkan sebanyak 136 kali, Insya Allah jasmani & rohani kita akan terhindar dari segala penyakit sehingga badan menjadi segar sihat & sejahtera."
            },
            {
                id: 7,
                arabic: "اَلْمُؤْمِنُ",
                rumi: "Ya Mukmin",
                meaning: "Maha Pengaman",
                penerangan: "Allah memberikan rasa aman kepada hamba-Nya yang beriman dan membenarkan risalah para rasul-Nya dengan mukjizat. Dalil: Surah Al-Hashr (59:23).",
                amalan: "Apabila dizikirkan sebanyak 236 kali, Insya Allah diri kita, keluarga & segala kekayaan yang dimiliki akan terpelihara & aman dari segala macam gangguan yang merosakkan."
            },
            {
                id: 8,
                arabic: "اَلْمُهَيْمِنُ",
                rumi: "Ya Muhaimin",
                meaning: "Maha Pelindung / Penjaga",
                penerangan: "Allah Maha Mengawasi, Memelihara, dan Mengetahui segala perkataan serta perbuatan makhluk-Nya. Dalil: Surah Al-Hashr (59:23).",
                amalan: "Apabila dizikirkan sebanyak 145 kali sesudah solat fardhu Isyak, Insya Allah fikiran & hati kita akan menjadi terang & bersih."
            },
            {

        // Pemboleh Ubah Keadaan Aplikasi
        let currentIndex = 0;
        let isAnimating = false;

        const tabAmalan = document.getElementById('tabAmalan');

        const btnNameAudio = document.getElementById('btnNameAudio');
        const btnNavAudio = document.getElementById('btnNavAudio');
        const amalanBox = document.getElementById('amalanBox');
        const amalanTitle = document.getElementById('amalanTitle');
        const amalanText = document.getElementById('amalanText');
        const btnPenerangan = document.getElementById('btnPenerangan');
        const btnAmalan = document.getElementById('btnAmalan');
        const nameSelector = document.getElementById('nameSelector');
        const counterBadge = document.getElementById('counterBadge');
        const progressBar = document.getElementById('progressBar');
        const cardNumberPill = document.getElementById('cardNumberPill');
        const resetModal = document.getElementById('resetModal');
        const cardNumberBg = document.getElementById('cardNumberBg');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideContainer = document.getElementById('slideContainer');
        const toastNotice = document.getElementById('toastNotice');

        // Papar mesej ringkas (ganti alert())
        function showToast(msg) {
            if (!toastNotice) return;
            toastNotice.textContent = msg;
            toastNotice.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastNotice.classList.add('hidden');
            }, 2600);
        }

        // Isi menu dropdown dengan kesemua 99 nama
        function populateSelector() {
            if (!nameSelector) return;
            nameSelector.innerHTML = '';
            asmaulHusna.forEach((item, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `${item.id}. ${item.rumi}`;
                opt.className = 'bg-slate-900 text-slate-100';
                nameSelector.appendChild(opt);
            });
        }

        // Muat kedudukan terakhir dari localStorage
        function init() {
            populateSelector();
            try {
                const savedIndex = localStorage.getItem('asmaulHusnaIndex');
                if (savedIndex !== null) {
                    const parsed = parseInt(savedIndex, 10);
                    if (!isNaN(parsed) && parsed >= 0 && parsed < asmaulHusna.length) {
                        currentIndex = parsed;
                    }
                }
            } catch (e) {
                // Abaikan jika localStorage disekat
            }
            updateCard(false);
        }

        // Ekstrak nombor Surah & Ayat dari teks penerangan (contoh: 59:23)
        function extractQuranReference(text) {
            if (!text) return null;
            const match = text.match(/(\d{1,3}):(\d{1,3})/);
            if (!match) return null;
            const surah = parseInt(match[1], 10);
            const ayah = parseInt(match[2], 10);
            if (surah < 1 || surah > 114 || ayah < 1) return null;
            return {
                surah,
                ayah,
                label: `QS ${surah}:${ayah}`
            };
        }

        // Kemas kini paparan kad
        function updateCard(animate = true, direction = 'next', autoPlay = false) {
            stopAllAudio();
            closeAllInfoPanels();

            const applyContent = () => {
                const data = asmaulHusna[currentIndex];
                arabicText.textContent = data.arabic;
                rumiText.textContent = data.rumi;
                meaningText.textContent = data.meaning;
                peneranganText.textContent = data.penerangan;
                if (amalanTitle) amalanTitle.textContent = `Amalan Zikir (${data.rumi})`;
                if (amalanText) amalanText.textContent = data.amalan;
                if (nameSelector) nameSelector.value = currentIndex;
                if (counterBadge) counterBadge.textContent = `${data.id} / ${asmaulHusna.length}`;
                if (cardNumberPill) cardNumberPill.textContent = `Nama #${data.id}`;
                if (progressBar) progressBar.style.width = `${(data.id / asmaulHusna.length) * 100}%`;
                cardNumberBg.textContent = data.id;

                // Semak jika ada rujukan ayat Al-Quran untuk audio Syeikh Al-Sudais
                currentSudaisRef = extractQuranReference(data.penerangan);
                if (currentSudaisRef && sudaisAudioContainer) {
                    sudaisAudioContainer.classList.remove('hidden');
                    if (sudaisRefBadge) sudaisRefBadge.textContent = currentSudaisRef.label;
                    if (sudaisBtnLabel) sudaisBtnLabel.textContent = 'Dengar Ayat Dalil (Syeikh Al-Sudais)';
                } else if (sudaisAudioContainer) {
                    sudaisAudioContainer.classList.add('hidden');
                }

                prevBtn.disabled = currentIndex === 0;
                nextBtn.disabled = currentIndex === asmaulHusna.length - 1;

                try {
                    localStorage.setItem('asmaulHusnaIndex', currentIndex);
                } catch (e) {}

                // Mainkan suara secara automatik apabila kad ditukar
                if (autoPlay) {
                    playCurrentNameAudio();
                }
            };

            if (!animate) {
                applyContent();
                return;
            }

            isAnimating = true;
            const outClass = direction === 'next' ? 'fade-out-left' : 'fade-out-right';
            slideContainer.classList.add(outClass);

            setTimeout(() => {
                applyContent();
                slideContainer.classList.remove(outClass);
                isAnimating = false;
            }, 200);
        }

        function nextName() {
            if (isAnimating || currentIndex >= asmaulHusna.length - 1) return;
            currentIndex++;
            updateCard(true, 'next', true);
        }

        function prevName() {
            if (isAnimating || currentIndex <= 0) return;
            currentIndex--;
            updateCard(true, 'prev', true);
        }

        function jumpToName(indexStr) {
            const target = parseInt(indexStr, 10);
            if (isNaN(target) || target < 0 || target >= asmaulHusna.length || target === currentIndex) return;
            const dir = target > currentIndex ? 'next' : 'prev';
            currentIndex = target;
            updateCard(true, dir, true);
        }

        // --- Modal Mula Semula ---
        function openResetModal() {
            if (resetModal) resetModal.classList.remove('hidden');
        }

        function closeResetModal() {
            if (resetModal) resetModal.classList.add('hidden');
        }

        function confirmReset() {
            closeResetModal();
            currentIndex = 0;
            updateCard(true, 'prev', true);
            showToast('Hafalan dimulakan semula dari Nama #1');
        }

        // --- Fungsi Laci Bawah (Bottom Sheet) Dalil & Amalan ---
        function closeAllInfoPanels() {
            activePanel = null;
            if (infoSheet) infoSheet.classList.add('translate-y-full');
            setTimeout(() => {
                if (activePanel === null && infoSheetOverlay) {
                    infoSheetOverlay.classList.add('hidden');
                }
            }, 250);
            if (peneranganBox) peneranganBox.classList.add('hidden');
            if (amalanBox) amalanBox.classList.add('hidden');
            if (btnPenerangan) btnPenerangan.classList.remove('ring-2', 'ring-teal-300', 'bg-teal-700');
            if (btnAmalan) btnAmalan.classList.remove('ring-2', 'ring-amber-300', 'bg-emerald-700');
        }

        function toggleInfoPanel(panelType) {
            if (activePanel === panelType && infoSheetOverlay && !infoSheetOverlay.classList.contains('hidden')) {
                return;
            }
            activePanel = panelType;

            if (infoSheetOverlay) infoSheetOverlay.classList.remove('hidden');
            requestAnimationFrame(() => {
                if (infoSheet) infoSheet.classList.remove('translate-y-full');
            });

            if (peneranganBox) peneranganBox.classList.add('hidden');
            if (amalanBox) amalanBox.classList.add('hidden');
            if (tabPenerangan) tabPenerangan.className = 'flex-1 text-xs sm:text-sm font-semibold py-2 px-3 rounded-lg transition-all text-slate-300';
            if (tabAmalan) tabAmalan.className = 'flex-1 text-xs sm:text-sm font-semibold py-2 px-3 rounded-lg transition-all text-slate-300';
            if (btnPenerangan) btnPenerangan.classList.remove('ring-2', 'ring-teal-300', 'bg-teal-700');
            if (btnAmalan) btnAmalan.classList.remove('ring-2', 'ring-amber-300', 'bg-emerald-700');

            if (panelType === 'penerangan') {
                peneranganBox.classList.remove('hidden');
                if (tabPenerangan) tabPenerangan.className = 'flex-1 text-xs sm:text-sm font-semibold py-2 px-3 rounded-lg transition-all bg-teal-600 text-white shadow';
                if (btnPenerangan) btnPenerangan.classList.add('ring-2', 'ring-teal-300', 'bg-teal-700');
            } else if (panelType === 'amalan') {
                amalanBox.classList.remove('hidden');
                if (tabAmalan) tabAmalan.className = 'flex-1 text-xs sm:text-sm font-semibold py-2 px-3 rounded-lg transition-all bg-amber-600 text-white shadow';
                if (btnAmalan) btnAmalan.classList.add('ring-2', 'ring-amber-300', 'bg-emerald-700');
            }
        }

        // --- Fungsi Audio (MP3 Islamic Network, SpeechSynthesis ar-SA & Bacaan Syeikh Al-Sudais) ---
        function setNameAudioPlayingUI(isPlaying) {
            if (btnNameAudio) {
                btnNameAudio.classList.toggle('animate-pulse', isPlaying);
                btnNameAudio.classList.toggle('bg-teal-600', isPlaying);
                btnNameAudio.classList.toggle('ring-2', isPlaying);
                btnNameAudio.classList.toggle('ring-teal-300', isPlaying);
            }
            if (btnNavAudio) {
                btnNavAudio.classList.toggle('animate-pulse', isPlaying);
                btnNavAudio.classList.toggle('bg-teal-700', isPlaying);
                btnNavAudio.classList.toggle('text-white', isPlaying);
            }
        }

        function stopAllAudio() {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
            } catch (e) {}

            if (nameAudioPlayer) {
                try {
                    nameAudioPlayer.onended = null;
                    nameAudioPlayer.onerror = null;
                    nameAudioPlayer.pause();
                    nameAudioPlayer.currentTime = 0;
                } catch (e) {}
                nameAudioPlayer = null;
            }

            if (sudaisAudioPlayer) {
                try {
                    sudaisAudioPlayer.onplaying = null;
                    sudaisAudioPlayer.onended = null;
                    sudaisAudioPlayer.onerror = null;
                    sudaisAudioPlayer.pause();
                    sudaisAudioPlayer.currentTime = 0;
                } catch (e) {}
                sudaisAudioPlayer = null;
            }
            isSudaisPlaying = false;
            if (sudaisBtnLabel) sudaisBtnLabel.textContent = 'Dengar Ayat Dalil (Syeikh Al-Sudais)';
            setNameAudioPlayingUI(false);
        }

        // Format teks Arab khusus untuk bacaan tajwid & wakaf sukun yang tepat
        function formatArabicForWaqf(arabicStr) {
            let text = arabicStr.trim();

            // Penyelarasan ejaan khusus supaya enjin suara Arab menyebut tafkhim & mad dengan tepat
            if (text === 'اَللّٰهُ') return 'اَللّٰهُ';
            if (text === 'اَلرَّحْمٰنُ') return 'اَلرَّحْمَانْ';

            // Tukar alif khanjariyah (ٰ) kepada alif mad biasa supaya mad 2 harakat dibaca jelas
            text = text.replace(/\u0670/g, 'ا');

            // Jika berakhir dengan syaddah + baris pendek (cth: اَلْحَقُّ), buang baris pendek sahaja
            if (/[\u0651][\u064E\u064F\u0650]$/.test(text)) {
                return text.replace(/([\u0651])[\u064E\u064F\u0650]$/, '$1');
            }
            // Jika berakhir dengan baris pendek (fathah/dammah/kasrah), tukar kepada sukun (wakaf)
            if (/[\u064E\u064F\u0650]$/.test(text)) {
                return text.replace(/[\u064E\u064F\u0650]$/, '\u0652');
            }
            return text;
        }

        // Cari suara Arab terbaik yang tersedia dalam pelayar (utamakan suara lelaki Arab Saudi)
        function pickBestArabicVoice() {
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices() || [];
            const arabicVoices = voices.filter(v => (v.lang || '').toLowerCase().startsWith('ar'));
            if (arabicVoices.length === 0) return null;

            const maleKeywords = ['maged', 'majed', 'tariq', 'tarik', 'naayf', 'hamed', 'hamid', 'male', 'saudi'];
            const preferred = arabicVoices.find(v => {
                const name = (v.name || '').toLowerCase();
                return maleKeywords.some(k => name.includes(k));
            });
            if (preferred) return preferred;

            const saVoice = arabicVoices.find(v => (v.lang || '').toLowerCase() === 'ar-sa');
            return saVoice || arabicVoices[0];
        }

        // Mainkan sebutan Arab menggunakan speechSynthesis (ar-SA) dengan teks Arab berbaris penuh
        function playArabicSpeechSynthesis(arabicStr) {
            const waqfArabic = formatArabicForWaqf(arabicStr);

            if (!('speechSynthesis' in window)) {
                setNameAudioPlayingUI(false);
                showToast('Pelayar anda tidak menyokong sintesis suara Arab.');
                return;
            }

            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(waqfArabic);
                utterance.lang = 'ar-SA';
                const arabicVoice = pickBestArabicVoice();
                if (arabicVoice) {
                    utterance.voice = arabicVoice;
                }
                utterance.rate = 0.85;
                utterance.pitch = 1.0;

                setNameAudioPlayingUI(true);

                utterance.onend = () => {
                    setNameAudioPlayingUI(false);
                };
                utterance.onerror = () => {
                    setNameAudioPlayingUI(false);
                };

                window.speechSynthesis.speak(utterance);
            } catch (err) {
                setNameAudioPlayingUI(false);
            }
        }

        // Mainkan audio nama Allah:
        // - Nama #1 (Ya Allah): terus guna speechSynthesis ar-SA
        // - Nama #2..#99: cuba MP3 islamic.network dengan pelarasan indeks (id - 1 -> 001.mp3, 002.mp3, ...)
        // - Fallback automatik ke speechSynthesis ar-SA jika audio luar disekat/gagal
        function playCurrentNameAudio() {
            stopAllAudio();
            const data = asmaulHusna[currentIndex];
            if (!data) return;

            // Nama #1 (Ya Allah) menggunakan speechSynthesis bahasa ar-SA dengan teks Arab berbaris penuh
            if (data.id === 1) {
                playArabicSpeechSynthesis(data.arabic);
                return;
            }

            // Pelarasan indeks: Nama #2 (Ar-Rahman) -> 001.mp3, Nama #3 (Ar-Rahim) -> 002.mp3, dst.
            const mp3Number = String(data.id - 1).padStart(3, '0');
            const mp3Url = `https://islamic.network/asma-al-husna/audio/${mp3Number}.mp3`;

            let fallbackTriggered = false;
            const triggerFallback = () => {
                if (fallbackTriggered) return;
                fallbackTriggered = true;
                if (nameAudioPlayer) {
                    try {
                        nameAudioPlayer.onended = null;
                        nameAudioPlayer.onerror = null;
                        nameAudioPlayer.pause();
                    } catch (e) {}
                    nameAudioPlayer = null;
                }
                playArabicSpeechSynthesis(data.arabic);
            };

            try {
                nameAudioPlayer = new Audio(mp3Url);
                setNameAudioPlayingUI(true);

                nameAudioPlayer.onended = () => {
                    setNameAudioPlayingUI(false);
                    nameAudioPlayer = null;
                };

                nameAudioPlayer.onerror = () => {
                    triggerFallback();
                };

                const playPromise = nameAudioPlayer.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {
                        triggerFallback();
                    });
                }
            } catch (e) {
                triggerFallback();
            }
        }

        // Mainkan bacaan ayat Al-Quran sebenar oleh Syeikh Abdul Rahman Al-Sudais
        async function playSudaisAyahAudio() {
            if (!currentSudaisRef) return;

            if (isSudaisPlaying) {
                stopAllAudio();
                return;
            }

            stopAllAudio();

            const surahPad = String(currentSudaisRef.surah).padStart(3, '0');
            const ayahPad = String(currentSudaisRef.ayah).padStart(3, '0');
            const primaryUrl = `https://everyayah.com/data/Abdurrahmaan_As-Sudais_192kbps/${surahPad}${ayahPad}.mp3`;

            const startSudaisPlayback = (url, allowApiFallback) => {
                try {
                    sudaisAudioPlayer = new Audio(url);
                    isSudaisPlaying = true;
                    if (sudaisBtnLabel) sudaisBtnLabel.textContent = 'Memuatkan bacaan...';

                    sudaisAudioPlayer.onplaying = () => {
                        if (sudaisBtnLabel) sudaisBtnLabel.textContent = 'Hentikan Bacaan (Syeikh Al-Sudais)';
                    };
                    sudaisAudioPlayer.onended = () => {
                        stopAllAudio();
                    };
                    sudaisAudioPlayer.onerror = async () => {
                        if (allowApiFallback) {
                            try {
                                const res = await fetch(`https://api.alquran.cloud/v1/ayah/${currentSudaisRef.surah}:${currentSudaisRef.ayah}/ar.abdurrahmaanasudais`);
                                const json = await res.json();
                                if (json && json.data && json.data.audio) {
                                    startSudaisPlayback(json.data.audio, false);
                                    return;
                                }
                            } catch (apiErr) {}
                        }
                        stopAllAudio();
                        showToast('Gagal memuatkan audio Syeikh Al-Sudais. Semak sambungan internet.');
                    };

                    const p = sudaisAudioPlayer.play();
                    if (p !== undefined) {
                        p.catch(() => {
                            stopAllAudio();
                            showToast('Sila tekan sekali lagi untuk memulakan audio.');
                        });
                    }
                } catch (e) {
                    stopAllAudio();
                    showToast('Audio tidak dapat dimainkan.');
                }
            };

            startSudaisPlayback(primaryUrl, true);
        }

        // Muatkan senarai suara pelayar awal-awal
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // --- Sokongan Leret Sentuhan (Touch Swipe) ---
        let touchstartX = 0;
        let touchstartY = 0;
        let isHorizontalSwipe = false;

        slideContainer.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].clientX;
            touchstartY = e.changedTouches[0].clientY;
            isHorizontalSwipe = false;
            slideContainer.classList.add('dragging');
        }, { passive: true });

        slideContainer.addEventListener('touchmove', e => {
            const currentX = e.changedTouches[0].clientX;
            const currentY = e.changedTouches[0].clientY;
            const diffX = currentX - touchstartX;
            const diffY = currentY - touchstartY;

            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 10) {
                isHorizontalSwipe = true;
                const dampedX = Math.max(-90, Math.min(90, diffX * 0.45));
                slideContainer.style.transform = `translateX(${dampedX}px)`;
            }
        }, { passive: true });

        slideContainer.addEventListener('touchend', e => {
            slideContainer.classList.remove('dragging');
            slideContainer.style.transform = '';

            if (!isHorizontalSwipe) return;

            const diffX = e.changedTouches[0].clientX - touchstartX;
            if (Math.abs(diffX) > 45) {
                if (diffX < 0) nextName();
                else prevName();
            }
        }, { passive: true });

        // --- Navigasi Papan Kekunci ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeAllInfoPanels();
                closeResetModal();
                return;
            }
            if (e.key === 'ArrowRight') {
                nextName();
            } else if (e.key === 'ArrowLeft') {
                prevName();
            }
        });

        // Mulakan aplikasi apabila halaman siap dimuatkan
        window.onload = function () {
            init();
        };
    </script>
</body>
