<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafalan 99 Nama Allah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            overflow-x: hidden;
        }
        .arabic-font {
            font-family: 'Amiri', serif;
        }
        
        /* Slide Transitions */
        .slide-container {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .fade-out-left {
            opacity: 0;
            transform: translateX(-50px);
        }
        .fade-out-right {
            opacity: 0;
            transform: translateX(50px);
        }

        /* Custom Scrollbar for list */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-teal-500 selection:text-white">

    <!-- Header -->
    <header class="w-full p-6 text-center z-10">
        <h1 class="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-teal-200 to-emerald-400 drop-shadow-md">
            Asmaul Husna
        </h1>
        <p class="text-slate-400 mt-2 text-sm md:text-base">Hafalan 99 Nama Allah</p>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 md:px-8 w-full max-w-2xl mx-auto z-10">
        
        <!-- Top Controls (Counter & Reset) -->
        <div class="w-full flex justify-between items-center mb-6 px-2">
            <div class="text-teal-300 font-semibold bg-teal-900/50 px-4 py-1.5 rounded-full border border-teal-700/50">
                <span id="counter">1</span> / 99
            </div>
            <button onclick="resetProgress()" class="text-sm text-slate-400 hover:text-white transition-colors flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Mula Semula
            </button>
        </div>

        <!-- The Card -->
        <div class="w-full h-[400px] md:h-[450px] mb-8 slide-container relative" id="slideContainer">
            <div class="w-full h-full bg-gradient-to-br from-teal-800 to-emerald-900 rounded-3xl p-6 md:p-8 flex flex-col items-center justify-center shadow-2xl border border-teal-600/30 relative overflow-hidden">
                
                <!-- Audio Button -->
                <button onclick="playCurrentNameAudio()" class="absolute top-4 right-4 md:top-6 md:right-6 text-teal-200 hover:text-white bg-teal-900/60 hover:bg-teal-700 p-3 rounded-full transition-all z-20 shadow-md backdrop-blur-sm border border-teal-600/50" title="Dengar Sebutan">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                </button>

                <!-- Background number -->
                <div class="absolute -right-4 -bottom-10 text-teal-900/40 text-[10rem] md:text-[12rem] font-black z-0 leading-none" id="cardNumberBg">1</div>

                <h2 class="arabic-font text-7xl md:text-8xl text-white mb-6 leading-tight text-center drop-shadow-lg z-10" id="arabicText">
                    الرَّحْمَنُ
                </h2>
                
                <div class="w-2/3 border-t border-teal-600/50 my-4 z-10"></div>
                
                <h3 class="text-3xl md:text-4xl font-bold text-yellow-300 tracking-wide text-center mb-3 z-10" id="rumiText">
                    Ar-Rahman
                </h3>
                
                <p class="text-2xl md:text-3xl font-medium text-teal-100 text-center z-10" id="meaningText">
                    Maha Pemurah
                </p>

                <!-- Butang Penerangan -->
                <button onclick="togglePenerangan()" id="btnPenerangan" class="mt-5 z-10 text-sm bg-teal-800/60 hover:bg-teal-700 text-teal-100 px-4 py-2 rounded-full transition-all border border-teal-500/40 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                    Baca Dalil / Penerangan
                </button>

                <!-- Kotak Penerangan (Disembunyikan pada asalnya) -->
                <div id="peneranganBox" class="hidden mt-4 z-10 p-4 bg-slate-900/60 rounded-xl border border-teal-600/30 text-teal-50 text-sm md:text-base text-center w-full max-w-sm backdrop-blur-md shadow-inner transition-all">
                    <p id="peneranganText" class="leading-relaxed"></p>
                </div>
            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="flex items-center justify-between w-full max-w-sm gap-4">
            <button onclick="prevName()" id="prevBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-white font-semibold py-4 px-6 rounded-2xl transition-all shadow-lg flex items-center justify-center gap-2 border border-slate-600 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Sebelum
            </button>
            <button onclick="nextName()" id="nextBtn" class="flex-1 bg-teal-600 hover:bg-teal-500 active:bg-teal-700 text-white font-semibold py-4 px-6 rounded-2xl transition-all shadow-lg shadow-teal-900/50 flex items-center justify-center gap-2 border border-teal-500 disabled:opacity-50 disabled:cursor-not-allowed">
                Seterus
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>

        <p class="text-slate-500 mt-8 text-sm text-center px-4">
            💡 Tips: Anda boleh meleret (swipe) kiri/kanan pada skrin atau guna kekunci anak panah untuk ke nama seterusnya.
        </p>

    </main>

    <!-- Background Decorative Elements -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-teal-900/30 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-emerald-900/20 rounded-full blur-3xl"></div>
    </div>

    <script>
        // Database of 99 Names of Allah with explanations and references
        const asmaulHusna = [
            { id: 1, arabic: "الرَّحْمَنُ", rumi: "Ar-Rahman", meaning: "Maha Pemurah", penerangan: "Rahmat-Nya meliputi segala sesuatu di dunia ini untuk semua makhluk. (Rujukan: Surah Al-Fatihah 1:3)" },
            { id: 2, arabic: "الرَّحِيمُ", rumi: "Ar-Rahim", meaning: "Maha Penyayang", penerangan: "Penyayang khusus kepada hamba-hambaNya yang beriman di akhirat kelak. (Rujukan: Surah Al-Ahzab 33:43)" },
            { id: 3, arabic: "الْمَلِكُ", rumi: "Al-Malik", meaning: "Maha Merajai / Menguasai", penerangan: "Penguasa mutlak dan Raja bagi seluruh alam semesta. (Rujukan: Surah Ta Ha 20:114)" },
            { id: 4, arabic: "الْقُدُّوسُ", rumi: "Al-Quddus", meaning: "Maha Suci", penerangan: "Suci dari segala sifat kekurangan dan kelemahan makhluk. (Rujukan: Surah Al-Jumu'ah 62:1)" },
            { id: 5, arabic: "السَّلَامُ", rumi: "As-Salam", meaning: "Maha Penyelamat / Sejahtera", penerangan: "Pemberi kesejahteraan dan keselamatan dari sebarang aib. (Rujukan: Surah Al-Hashr 59:23)" },
            { id: 6, arabic: "الْمُؤْمِنُ", rumi: "Al-Mu'min", meaning: "Maha Melimpahkan Keamanan", penerangan: "Pemberi rasa aman kepada hambaNya yang beriman. (Rujukan: Surah Al-Hashr 59:23)" },
            { id: 7, arabic: "الْمُهَيْمِنُ", rumi: "Al-Muhaymin", meaning: "Maha Pengawal / Penjaga", penerangan: "Mengawasi, menyaksikan dan memelihara segala urusan hambaNya. (Rujukan: Surah Al-Hashr 59:23)" },
            { id: 8, arabic: "الْعَزِيزُ", rumi: "Al-Aziz", meaning: "Maha Berkuasa", penerangan: "Maha Perkasa, kehendakNya sentiasa menang dan tiada yang dapat mengalahkanNya. (Rujukan: Surah Ali 'Imran 3:62)" },
            { id: 9, arabic: "الْجَبَّارُ", rumi: "Al-Jabbar", meaning: "Maha Kuat / Perkasa", penerangan: "KehendakNya wajib terlaksana ke atas semua makhluk tanpa halangan. (Rujukan: Surah Al-Hashr 59:23)" },
            { id: 10, arabic: "الْمُتَكَبِّرُ", rumi: "Al-Mutakabbir", meaning: "Maha Megah", penerangan: "Pemilik mutlak segala kebesaran, keagungan dan kemegahan. (Rujukan: Surah Al-Hashr 59:23)" },
            { id: 11, arabic: "الْخَالِقُ", rumi: "Al-Khaliq", meaning: "Maha Pencipta", penerangan: "Pencipta segala sesuatu dari tiada kepada ada mengikut kehendakNya. (Rujukan: Surah Al-Hashr 59:24)" },
            { id: 12, arabic: "الْبَارِئُ", rumi: "Al-Bari'", meaning: "Maha Menjadikan", penerangan: "Yang mewujudkan ciptaan dari pelan/ketetapan kepada bentuk yang nyata. (Rujukan: Surah Al-Hashr 59:24)" },
            { id: 13, arabic: "الْمُصَوِّرُ", rumi: "Al-Musawwir", meaning: "Maha Membentuk Rupa", penerangan: "Membentuk dan mengukir rupa makhluk dengan pelbagai bentuk yang unik. (Rujukan: Surah Al-Hashr 59:24)" },
            { id: 14, arabic: "الْغَفَّارُ", rumi: "Al-Ghaffar", meaning: "Maha Pengampun", penerangan: "Sangat banyak mengampuni dosa dan menutup aib hambaNya berulang kali. (Rujukan: Surah Taha 20:82)" },
            { id: 15, arabic: "الْقَهَّارُ", rumi: "Al-Qahhar", meaning: "Maha Menundukkan Segala-galanya", penerangan: "Menundukkan segala sesuatu dengan kekuasaanNya yang tidak tertanding. (Rujukan: Surah Ar-Ra'd 13:16)" },
            { id: 16, arabic: "الْوَهَّابُ", rumi: "Al-Wahhab", meaning: "Maha Pemberi Kurnia", penerangan: "Sentiasa melimpahkan pemberian dan kurnia tanpa meminta sebarang balasan. (Rujukan: Surah Ali 'Imran 3:8)" },
            { id: 17, arabic: "الرَّزَّاقُ", rumi: "Ar-Razzaq", meaning: "Maha Pemberi Rezeki", penerangan: "Menciptakan rezeki dan menyampaikannya kepada semua makhluk yang memerlukannya. (Rujukan: Surah Adz-Dzariyat 51:58)" },
            { id: 18, arabic: "الْفَتَّاحُ", rumi: "Al-Fattah", meaning: "Maha Pembuka Rahmat", penerangan: "Membuka pintu-pintu rahmat, rezeki, dan jalan penyelesaian bagi hambaNya. (Rujukan: Surah Saba' 34:26)" },
            { id: 19, arabic: "الْعَلِيمُ", rumi: "Al-Alim", meaning: "Maha Mengetahui", penerangan: "Mengetahui secara sempurna segala sesuatu, yang zahir mahupun yang tersembunyi. (Rujukan: Surah Al-Baqarah 2:115)" },
            { id: 20, arabic: "الْقَابِضُ", rumi: "Al-Qabidz", meaning: "Maha Pengekang", penerangan: "Menahan atau menyempitkan rezeki dan kehidupan mengikut hikmahNya. (Rujukan: Surah Al-Baqarah 2:245)" },
            { id: 21, arabic: "الْبَاسِطُ", rumi: "Al-Basit", meaning: "Maha Melapangkan", penerangan: "Meluaskan rezeki dan kebaikan kepada sesiapa yang dikehendakiNya. (Rujukan: Surah Ar-Ra'd 13:26)" },
            { id: 22, arabic: "الْخَافِضُ", rumi: "Al-Khafidz", meaning: "Maha Merendahkan (Darjat)", penerangan: "Merendahkan darjat golongan yang angkuh, ingkar dan zalim. (Berdasarkan perbuatan Allah dalam nas syarak)" },
            { id: 23, arabic: "الرَّافِعُ", rumi: "Ar-Rafi'", meaning: "Maha Meninggikan (Darjat)", penerangan: "Meninggikan darjat hamba-hambaNya yang beriman dan berilmu. (Rujukan: Surah Al-Mujadilah 58:11)" },
            { id: 24, arabic: "الْمُعِزُّ", rumi: "Al-Mu'izz", meaning: "Maha Memuliakan", penerangan: "Memberi kemuliaan dan kehebatan kepada sesiapa yang dikehendakiNya. (Rujukan: Surah Ali 'Imran 3:26)" },
            { id: 25, arabic: "الْمُذِلِّ", rumi: "Al-Muzill", meaning: "Maha Menghinakan", penerangan: "Menghinakan dan merendahkan martabat orang yang melawan kebenaran. (Rujukan: Surah Ali 'Imran 3:26)" },
            { id: 26, arabic: "السَّمِيعُ", rumi: "As-Sami'", meaning: "Maha Mendengar", penerangan: "Mendengar segala-galanya, sama ada diucapkan secara kuat atau berbisik di dalam hati. (Rujukan: Surah Asy-Syura 42:11)" },
            { id: 27, arabic: "الْبَصِيرُ", rumi: "Al-Basir", meaning: "Maha Melihat", penerangan: "Melihat segala yang nyata dan tersembunyi dengan penglihatan yang sempurna. (Rujukan: Surah Al-Hujurat 49:18)" },
            { id: 28, arabic: "الْحَكَمُ", rumi: "Al-Hakam", meaning: "Maha Menetapkan Hukum", penerangan: "Hakim mutlak yang meletakkan ketetapan hukum tanpa kezaliman sedikitpun. (Rujukan: Surah Al-An'am 6:114)" },
            { id: 29, arabic: "الْعَدْلُ", rumi: "Al-'Adl", meaning: "Maha Adil", penerangan: "KeadilanNya mutlak, langsung tidak pernah menzalimi hambaNya. (Rujukan: Surah An-Nisa 4:40)" },
            { id: 30, arabic: "اللَّطِيفُ", rumi: "Al-Latif", meaning: "Maha Lembut / Halus", penerangan: "Sangat halus urusanNya dan menyantuni hambaNya tanpa mereka sedari. (Rujukan: Surah Al-Mulk 67:14)" },
            { id: 31, arabic: "الْخَبِيرُ", rumi: "Al-Khabir", meaning: "Maha Waspada / Mengetahui", penerangan: "Maha Mengetahui sesuatu secara mendalam dan terperinci hingga ke akar umbi. (Rujukan: Surah Al-An'am 6:103)" },
            { id: 32, arabic: "الْحَلِيمُ", rumi: "Al-Halim", meaning: "Maha Penyabar", penerangan: "Sangat bersabar, tidak tergesa-gesa menghukum hambaNya yang berdosa agar mereka bertaubat. (Rujukan: Surah Al-Baqarah 2:225)" },
            { id: 33, arabic: "الْعَظِيمُ", rumi: "Al-'Azim", meaning: "Maha Agung", penerangan: "KeagunganNya tidak dapat dibayangkan oleh akal fikiran makhlukNya. (Rujukan: Surah Al-Baqarah 2:255 - Ayatul Kursi)" },
            { id: 34, arabic: "الْغَفُورُ", rumi: "Al-Ghafur", meaning: "Maha Pengampun", penerangan: "Banyak memberi ampun dan memaafkan segala dosa betapapun besarnya. (Rujukan: Surah Az-Zumar 39:53)" },
            { id: 35, arabic: "الشَّكُورُ", rumi: "Ash-Shakur", meaning: "Maha Menghargai / Mensyukuri", penerangan: "Sangat menghargai amalan kebaikan hamba walau sedikit dan melipatgandakan pahalanya. (Rujukan: Surah Fatir 35:30)" },
            { id: 36, arabic: "الْعَلِيُّ", rumi: "Al-'Aliy", meaning: "Maha Tinggi", penerangan: "Maha Tinggi darjat dan kedudukanNya dari segala sifat makhluk. (Rujukan: Surah Al-Baqarah 2:255)" },
            { id: 37, arabic: "الْكَبِيرُ", rumi: "Al-Kabir", meaning: "Maha Besar", penerangan: "KebesaranNya mengatasi segala yang wujud; tiada yang lebih besar daripadaNya. (Rujukan: Surah Ar-Ra'd 13:9)" },
            { id: 38, arabic: "الْحَفِيظُ", rumi: "Al-Hafidz", meaning: "Maha Memelihara", penerangan: "Memelihara segala makhlukNya dan menjaga amalan hamba daripada hilang. (Rujukan: Surah Hud 11:57)" },
            { id: 39, arabic: "الْمُقِيتُ", rumi: "Al-Muqit", meaning: "Maha Menjaga / Memberi Keperluan", penerangan: "Menjamin dan menyediakan rezeki serta makanan bagi setiap makhluk yang bernyawa. (Rujukan: Surah An-Nisa 4:85)" },
            { id: 40, arabic: "الْحَسِيبُ", rumi: "Al-Hasib", meaning: "Maha Menghitung", penerangan: "Maha Mencukupi bagi hambaNya dan Maha Menghitung amal perbuatan manusia kelak. (Rujukan: Surah An-Nisa 4:86)" },
            { id: 41, arabic: "الْجَلِيلُ", rumi: "Al-Jalil", meaning: "Maha Luhur", penerangan: "Mempunyai sifat-sifat kebesaran, kemuliaan, dan keluhuran yang mutlak. (Berasaskan sifat Keagungan Allah)" },
            { id: 42, arabic: "الْكَرِيمُ", rumi: "Al-Karim", meaning: "Maha Pemurah / Mulia", penerangan: "Teramat Pemurah, memberi kurnia walau tidak diminta dan mengampunkan saat hamba bersalah. (Rujukan: Surah Al-Infitar 82:6)" },
            { id: 43, arabic: "الرَّقِيبُ", rumi: "Ar-Raqib", meaning: "Maha Mengawasi", penerangan: "Sentiasa memantau dan mengawasi setiap gerak-geri, perbuatan, dan bisikan hambaNya. (Rujukan: Surah An-Nisa 4:1)" },
            { id: 44, arabic: "الْمُجِيبُ", rumi: "Al-Mujib", meaning: "Maha Mengabulkan", penerangan: "Mendengar dan memperkenankan doa hamba yang meminta kepadaNya. (Rujukan: Surah Hud 11:61)" },
            { id: 45, arabic: "الْوَاسِعُ", rumi: "Al-Wasi'", meaning: "Maha Luas", penerangan: "Ilmu, rezeki, rahmat, dan keampunanNya sangat luas meliputi segalanya. (Rujukan: Surah Al-Baqarah 2:268)" },
            { id: 46, arabic: "الْحَكِيمُ", rumi: "Al-Hakim", meaning: "Maha Bijaksana", penerangan: "Setiap ciptaan, perintah, dan takdirNya diletakkan pada hikmah dan kebaikan yang tepat. (Rujukan: Surah At-Tin 95:8)" },
            { id: 47, arabic: "الْوَدُودُ", rumi: "Al-Wadud", meaning: "Maha Pencinta", penerangan: "Sangat mencintai hamba-hambaNya yang beriman dan bertaubat. (Rujukan: Surah Hud 11:90)" },
            { id: 48, arabic: "الْمَجِيدُ", rumi: "Al-Majid", meaning: "Maha Mulia", penerangan: "Zat yang sempurna kemuliaanNya dan banyak kebaikanNya. (Rujukan: Surah Hud 11:73)" },
            { id: 49, arabic: "الْبَاعِثُ", rumi: "Al-Ba'ith", meaning: "Maha Membangkitkan", penerangan: "Yang akan membangkitkan dan menghidupkan semula makhluk dari kubur pada Hari Kiamat. (Rujukan: Surah Al-Hajj 22:7)" },
            { id: 50, arabic: "الشَّهِيدُ", rumi: "Ash-Shahid", meaning: "Maha Menyaksikan", penerangan: "Tidak ada suatu pun yang tersembunyi dari kesaksian dan pemerhatianNya. (Rujukan: Surah Al-Ma'idah 5:117)" },
            { id: 51, arabic: "الْحَقُّ", rumi: "Al-Haqq", meaning: "Maha Benar", penerangan: "Kewujudan, janji, dan agamaNya adalah suatu kebenaran yang tidak dapat disangkal. (Rujukan: Surah Taha 20:114)" },
            { id: 52, arabic: "الْوَكِيلُ", rumi: "Al-Wakil", meaning: "Maha Memelihara Penyerahan", penerangan: "Sebaik-baik tempat berserah dan tempat bergantung segala urusan makhluk. (Rujukan: Surah Ali 'Imran 3:173)" },

        // State variables
        let currentIndex = 0;
        let peneranganOpen = false;

        // DOM Elements
        const arabicText = document.getElementById('arabicText');
        const rumiText = document.getElementById('rumiText');
        const meaningText = document.getElementById('meaningText');
        const peneranganBox = document.getElementById('peneranganBox');
        const peneranganText = document.getElementById('peneranganText');
        const counter = document.getElementById('counter');
        const cardNumberBg = document.getElementById('cardNumberBg');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideContainer = document.getElementById('slideContainer');

        // Initialize App
        function init() {
            // Load saved progress from localStorage if it exists
            const savedIndex = localStorage.getItem('asmaulHusnaIndex');
            if (savedIndex !== null) {
                currentIndex = parseInt(savedIndex);
            }
            updateCard();
        }

        // Update the card UI based on currentIndex
        function updateCard(direction = 'none') {
            const data = asmaulHusna[currentIndex];
            
            // Animation handling
            if (direction === 'next') {
                slideContainer.classList.add('fade-out-left');
            } else if (direction === 'prev') {
                slideContainer.classList.add('fade-out-right');
            }

            setTimeout(() => {
                populateData();

                function populateData() {
                    arabicText.textContent = data.arabic;
                    rumiText.textContent = data.rumi;
                    meaningText.textContent = data.meaning;
                    if (peneranganText) peneranganText.textContent = data.penerangan;
                    counter.textContent = data.id;
                    cardNumberBg.textContent = data.id;

                    // Tutup kotak penerangan apabila bertukar kad
                    peneranganOpen = false;
                    if(peneranganBox) peneranganBox.classList.add('hidden');

                    // Update button states
                    prevBtn.disabled = currentIndex === 0;
                    nextBtn.disabled = currentIndex === asmaulHusna.length - 1;

                    // Save progress
                    localStorage.setItem('asmaulHusnaIndex', currentIndex);

                    // Remove animation classes to fade back in
                    slideContainer.classList.remove('fade-out-left', 'fade-out-right');
                }
            }, direction !== 'none' ? 200 : 0);
        }

        // Next button handler
        function nextName() {
            if (currentIndex < asmaulHusna.length - 1) {
                currentIndex++;
                updateCard('next');
            }
        }

        // Prev button handler
        function prevName() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard('prev');
            }
        }

        // Reset progress
        function resetProgress() {
            if(confirm("Adakah anda pasti mahu mula dari awal (Nama 1)?")) {
                currentIndex = 0;
                updateCard('prev');
            }
        }

        // --- Toggle Penerangan ---
        function togglePenerangan() {
            peneranganOpen = !peneranganOpen;
            if (peneranganOpen) {
                peneranganBox.classList.remove('hidden');
            } else {
                peneranganBox.classList.add('hidden');
            }
        }

        // --- Audio Functionality ---
        let currentAudio = null;

        // Pastikan senarai suara dimuatkan (untuk sesetengah pelayar web)
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }

        function playCurrentNameAudio() {
            // Hentikan audio sebelumnya jika sedang dimainkan
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            
            const data = asmaulHusna[currentIndex];
            
            // --- FUNGSI WAKAF TAJWID ---
            // Cari tulisan Arab, buang baris di huruf terakhir (Damma/Fatha/Kasra) 
            // dan gantikan dengan tanda Sukun (Mati). 
            // Ini akan memaksa sistem komputer mematuhi hukum Wakaf.
            let textToRead = data.arabic.replace(/[\u064E\u064F\u0650]$/, '\u0652');
            textToRead += " ."; // Titik di hujung untuk paksa suara berhenti (pause)
            
            let useLocalTTS = false;
            
            // Menggunakan Web Speech API untuk suara tempatan
            if ('speechSynthesis' in window) {
                const voices = window.speechSynthesis.getVoices();
                // Cari suara Bahasa Arab (ar)
                const arabicVoices = voices.filter(v => v.lang.startsWith('ar'));
                
                if (arabicVoices.length > 0) {
                    useLocalTTS = true;
                    window.speechSynthesis.cancel(); // Hentikan suara yang sedang bercakap
                    
                    const utterance = new SpeechSynthesisUtterance(textToRead);
                    utterance.lang = 'ar-SA';
                    utterance.rate = 0.8;  // Perlahan sedikit supaya tajwid jelas
                    utterance.pitch = 0.6; // Rendahkan nada supaya bunyi garau (lelaki)

                    // Cuba cari profil suara lelaki (jika wujud dalam peranti)
                    const maleVoice = arabicVoices.find(v => v.name.toLowerCase().includes('male'));
                    
                    if (maleVoice) {
                        utterance.voice = maleVoice;
                    } else {
                        utterance.voice = arabicVoices[0];
                    }

                    window.speechSynthesis.speak(utterance);
                }
            }

            // Jika peranti TIADA suara Arab, automatik guna Audio Awan (Cloud Arab)
            if (!useLocalTTS) {
                // Gunakan tl=ar untuk Bahasa Arab
                const audioUrl = `https://translate.googleapis.com/translate_tts?client=tw-ob&ie=UTF-8&tl=ar&q=${encodeURIComponent(textToRead)}`;
                
                currentAudio = new Audio(audioUrl);
                // Rendahkan kelajuan Cloud TTS (0.8) supaya nadanya lebih berat/garau 
                // menyamai lelaki dan rentak bacaannya tertib
                currentAudio.playbackRate = 0.8; 
                
                currentAudio.play().catch(error => {
                    console.error("Ralat memainkan audio:", error);
                    const btn = document.querySelector('button[title="Dengar Sebutan"]');
                    const originalHtml = btn.innerHTML;
                    btn.innerHTML = `<span class="text-xs font-bold text-red-300">Ralat 🔇</span>`;
                    setTimeout(() => btn.innerHTML = originalHtml, 2000);
                });
            }
        }

        // --- Touch Swipe Functionality for Mobile ---
        let touchstartX = 0;
        let touchendX = 0;
        let touchstartY = 0;
        let touchendY = 0;

        function handleGesture() {
            // Check if horizontal swipe is larger than vertical (to prevent scrolling conflict)
            if (Math.abs(touchendX - touchstartX) > Math.abs(touchendY - touchstartY)) {
                if (touchendX < touchstartX - 50) {
                    // Swiped Left -> Next
                    nextName();
                }
                if (touchendX > touchstartX + 50) {
                    // Swiped Right -> Prev
                    prevName();
                }
            }
        }

        slideContainer.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
        });

        slideContainer.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            handleGesture();
        });

        // --- Keyboard Navigation ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextName();
            } else if (e.key === 'ArrowLeft') {
                prevName();
            }
        });

        // Run initialization
        init();
    </script>
