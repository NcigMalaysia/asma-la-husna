        // State variables
        let currentIndex = 0;

        // DOM Elements
        const arabicText = document.getElementById('arabicText');
        const rumiText = document.getElementById('rumiText');
        const meaningText = document.getElementById('meaningText');
        const counter = document.getElementById('counter');
        const cardNumberBg = document.getElementById('cardNumberBg');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideContainer = document.getElementById('slideContainer');

        // Initialize App
        function init() {
            // Load saved progress from localStorage if it exists
            const savedIndex = localStorage.getItem('asmaulHusnaIndex');
            if (savedIndex !== null) {
                currentIndex = parseInt(savedIndex);
            }
            updateCard();
        }

        // Update the card UI based on currentIndex
        function updateCard(direction = 'none') {
            const data = asmaulHusna[currentIndex];
            
            // Animation handling
            if (direction === 'next') {
                slideContainer.classList.add('fade-out-left');
            } else if (direction === 'prev') {
                slideContainer.classList.add('fade-out-right');
            }

            setTimeout(() => {
                populateData();

                function populateData() {
                    arabicText.textContent = data.arabic;
                    rumiText.textContent = data.rumi;
                    meaningText.textContent = data.meaning;
                    counter.textContent = data.id;
                    cardNumberBg.textContent = data.id;

                    // Update button states
                    prevBtn.disabled = currentIndex === 0;
                    nextBtn.disabled = currentIndex === asmaulHusna.length - 1;

                    // Save progress
                    localStorage.setItem('asmaulHusnaIndex', currentIndex);

                    // Remove animation classes to fade back in
                    slideContainer.classList.remove('fade-out-left', 'fade-out-right');
                }
            }, direction !== 'none' ? 200 : 0);
        }

        // Next button handler
        function nextName() {
            if (currentIndex < asmaulHusna.length - 1) {
                currentIndex++;
                updateCard('next');
            }
        }

        // Prev button handler
        function prevName() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard('prev');
            }
        }

            if(confirm("Adakah anda pasti mahu mula dari awal (Nama 1)?")) {
                currentIndex = 0;
                updateCard('prev');
            }

                window.speechSynthesis.getVoices();
            };
        }

            // Hentikan audio sebelumnya jika sedang dimainkan
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            
            const data = asmaulHusna[currentIndex];
            
            // --- FUNGSI WAKAF TAJWID ---
            // Cari tulisan Arab, buang baris di huruf terakhir (Damma/Fatha/Kasra) 
            // dan gantikan dengan tanda Sukun (Mati). 
            // Ini akan memaksa sistem komputer mematuhi hukum Wakaf.
            let textToRead = data.arabic.replace(/[\u064E\u064F\u0650]$/, '\u0652');
            textToRead += " ."; // Titik di hujung untuk paksa suara berhenti (pause)
            
            let useLocalTTS = false;
            
            // Menggunakan Web Speech API untuk suara tempatan
            if ('speechSynthesis' in window) {
                const voices = window.speechSynthesis.getVoices();
                // Cari suara Bahasa Arab (ar)
                const arabicVoices = voices.filter(v => v.lang.startsWith('ar'));
                
                if (arabicVoices.length > 0) {
                    useLocalTTS = true;
                    window.speechSynthesis.cancel(); // Hentikan suara yang sedang bercakap
                    
                    const utterance = new SpeechSynthesisUtterance(textToRead);
                    utterance.lang = 'ar-SA';
                    utterance.rate = 0.8;  // Perlahan sedikit supaya tajwid jelas
                    utterance.pitch = 0.6; // Rendahkan nada supaya bunyi garau (lelaki)

                    // Cuba cari profil suara lelaki (jika wujud dalam peranti)
                    const maleVoice = arabicVoices.find(v => v.name.toLowerCase().includes('male'));
                    
                    if (maleVoice) {
                        utterance.voice = maleVoice;
                    } else {
                        utterance.voice = arabicVoices[0];
                    }

                    window.speechSynthesis.speak(utterance);
                }
            }

            // Jika peranti TIADA suara Arab, automatik guna Audio Awan (Cloud Arab)
            if (!useLocalTTS) {
                // Gunakan tl=ar untuk Bahasa Arab
                const audioUrl = `https://translate.googleapis.com/translate_tts?client=tw-ob&ie=UTF-8&tl=ar&q=${encodeURIComponent(textToRead)}`;
                
                currentAudio = new Audio(audioUrl);
                // Rendahkan kelajuan Cloud TTS (0.8) supaya nadanya lebih berat/garau 
                // menyamai lelaki dan rentak bacaannya tertib
                currentAudio.playbackRate = 0.8; 
                
                currentAudio.play().catch(error => {
                    console.error("Ralat memainkan audio:", error);
                    const btn = document.querySelector('button[title="Dengar Sebutan"]');
                    const originalHtml = btn.innerHTML;
                    btn.innerHTML = `<span class="text-xs font-bold text-red-300">Ralat 🔇</span>`;
                    setTimeout(() => btn.innerHTML = originalHtml, 2000);
                });
            }
        }

        // --- Touch Swipe Functionality for Mobile ---
        let touchstartX = 0;
        let touchendX = 0;
        let touchstartY = 0;
        let touchendY = 0;

        function handleGesture() {
            // Check if horizontal swipe is larger than vertical (to prevent scrolling conflict)
            if (Math.abs(touchendX - touchstartX) > Math.abs(touchendY - touchstartY)) {
                if (touchendX < touchstartX - 50) {
                    // Swiped Left -> Next
                    nextName();
                }
                if (touchendX > touchstartX + 50) {
                    // Swiped Right -> Prev
                    prevName();
                }
            }
        }

        slideContainer.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
        });

        slideContainer.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            handleGesture();
        });

        // --- Keyboard Navigation ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextName();
            } else if (e.key === 'ArrowLeft') {
                prevName();
            }
        });

        // Run initialization
        init();
    </script>
</body>
</html>
